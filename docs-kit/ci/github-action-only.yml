# .github/workflows/docs.yml —— 引用模式（推荐 GitHub 用户用这个）
#
# 与 vendor 模式的区别只有一件事：**脚本不在你的仓库里**。
# 你不需要 scripts/ 目录，工具升级也不用改你的仓库 —— 把下面 @v1 换成新版本号即可。
#
# 前提：仓库根目录要有 .knowledge.mjs（`npx docwarden init` 会生成一份）。
#
# 需要先配好：
#   Repository secrets：LLM_API_KEY
#   模型接口（baseUrl / model）从仓库根目录的 .knowledge.mjs 读 —— 那里刻意留空，
#   要你自己填。若更愿意放 Secret，把各 job 里注释掉的那两行打开；注意 env 一旦是
#   **空值**，脚本会当成「没配」并报错，所以要么给真值、要么整行保持注释。
#   Settings → Actions → General → Workflow permissions 选 "Read and write permissions"
#   （不开这条，机器人跑得再对也开不出 PR，而且不会有明显报错）
#
# 另外建议把 .docs-preview.md 加进 .gitignore。
#
# 想改成 vendor 模式（脚本拷进自己仓库、CI 不联网取工具）：
# 用 docs-kit/ci/github-actions.yml 那份，把 run: node scripts/docs-update.mjs 保留即可。

name: docs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
    # 关键：忽略文档自身变更，否则文档提交会再次触发自己，形成死循环。
    paths-ignore:
      - "docs/**"
      - ".docs-preview.md"
  release:
    types: [published]
  schedule:
    # UTC 22:00 = 北京时间次日 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

# 同一分支上的文档任务串行执行，避免两个进程同时写文件造成冲突
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 契机一：PR 阶段的影响预览（只读，不写任何正式文件）─────────
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 算 merge-base 需要完整历史

      - name: 生成文档影响预览
        id: gen
        # 模型服务不稳定时不要让整个流程挂掉，评论里会说明情况
        continue-on-error: true
        uses: xiaoanbucai/docwarden@v1
        with:
          mode: preview
          base: ${{ github.event.pull_request.base.sha }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}

      - name: 贴到 PR（同一条评论反复更新，不刷屏）
        if: always() && steps.gen.outputs.preview_path != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          path: ${{ steps.gen.outputs.preview_path }}

  # ── 契机二：主干合并后的正式更新 ─────────────────────────────
  update:
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50       # 需要历史来做 diff

      - name: 更新当前态文档
        uses: xiaoanbucai/docwarden@v1
        with:
          mode: incremental
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}

      - name: 开文档 PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: 自动更新模块文档"
          title: "docs: 自动更新模块文档"
          body: |
            由主干合并事件自动触发，基于最新代码重新生成。

            请重点确认：
            - [ ] 有没有描述代码中不存在的功能（最需要警惕的一类错误）
            - [ ] 有没有复述源码而不是描述职责
            - [ ] 标了 `[待确认]` 的地方是否需要补充

            如果内容长期有问题，请改提示词模板，不要手动改 `docs/current/`
            —— 下次生成会覆盖掉。（引用模式下把 `scripts/prompts/` 拷进你的仓库即可覆盖）

            未变的模块不会被重新生成，所以本次改动范围应该很小。
          branch: docs/auto-update
          delete-branch: true
          labels: documentation, automated
          add-paths: |
            docs/**

  # ── 契机三：Release 标签 → 版本章节 ──────────────────────────
  chapter:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成版本演进章节
        uses: xiaoanbucai/docwarden@v1
        with:
          mode: chapter
          version: ${{ github.event.release.tag_name }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}

      - name: 开章节 PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: 新增 ${{ github.event.release.tag_name }} 版本章节"
          title: "docs: 新增 ${{ github.event.release.tag_name }} 版本章节"
          body: |
            从上一个 tag 到本次发布之间的变更，被压缩成一段演进叙事。

            请重点确认：
            - [ ] 有没有替作者编造改动原因（提示词已禁止，但仍需抽查）
            - [ ] 主要变更是否控制在 5 条以内，有没有变成提交列表
            - [ ] 「与上一版的关系」是否准确
          branch: docs/release-${{ github.event.release.tag_name }}
          delete-branch: true
          labels: documentation, automated

  # ── 契机四：每日巡检（兜底）──────────────────────────────────
  # 触发失败、流水线被跳过、有人绕过了流程，都会在这里被兜住。
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 巡检并修复漂移
        uses: xiaoanbucai/docwarden@v1
        with:
          mode: audit
          fix: "true"
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}

      - name: 有漂移时开 PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: 巡检修复漂移文档"
          title: "docs: 巡检修复漂移文档"
          body: |
            每日定时巡检发现，以下情况会被修复：

            - 代码已变更但文档未更新（触发遗漏）
            - 从未生成过文档的模块
            - 配置中路径失效的模块（巡检会同时报告配置健康度）

            如果没有漂移，本次不会产生任何 PR。
          branch: docs/audit-fix
          delete-branch: true
          labels: documentation, automated
