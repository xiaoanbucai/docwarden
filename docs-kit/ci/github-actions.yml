# .github/workflows/docs.yml
#
# 四个触发契机，各司其职：
#   1. pull_request → 生成文档影响预览，贴成 PR 评论（不写入仓库）
#   2. push 主干    → 正式更新 docs/current/，开自动 PR
#   3. release      → 生成版本演进章节，写入 docs/history/
#   4. schedule     → 每日巡检，找出文档与代码不一致的模块并修复
#
# 前置配置：
#   Repository secrets：LLM_API_KEY
#   模型接口（baseUrl / model）从仓库根目录的 .knowledge.mjs 读 —— 那里刻意留空，
#   要你自己填。若更愿意放 Secret，把各 job 里注释掉的那两行打开；注意 env 一旦是
#   **空值**，脚本会当成「没配」并报错，所以要么给真值、要么整行保持注释。
#   Settings → Actions → General → Workflow permissions 选 "Read and write permissions"
#
# 另外建议把 .docs-preview.md 加进 .gitignore。

name: docs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
    # 关键：忽略文档自身变更，否则文档提交会再次触发自己，形成死循环。
    # 这是「硬」机制，比单靠提交信息里的 [skip ci] 可靠。
    paths-ignore:
      - "docs/**"
      - ".docs-preview.md"
  release:
    types: [published]
  schedule:
    # UTC 22:00 = 北京时间次日 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

# 同一分支上的文档任务串行执行，避免两个进程同时写文件造成冲突
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 契机一：PR 阶段的影响预览 ────────────────────────────────
  # 让每个人在合并之前就能看到「我这条分支会让文档变成什么样」。
  # 只读，不写任何正式文件。
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 需要 merge-base 来算 diff，0 表示取全部历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成文档影响预览
        id: gen
        # 模型服务不稳定时不要让整个流程挂掉，评论里会说明情况
        continue-on-error: true
        # baseUrl / model 从仓库根目录的 .knowledge.mjs 读 —— 那里刻意留空，要你自己填。
        # 若更愿意放在 Secret 里，把下面两行的注释去掉。注意：env 一旦给出**空值**，
        # 脚本会当成「没配」并报错，所以要么给真值，要么整行保持注释。
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          # LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          node scripts/docs-update.mjs \
            --mode preview \
            --base=${{ github.event.pull_request.base.sha }}

      - name: 贴到 PR（同一条评论反复更新，不刷屏）
        if: always() && hashFiles('.docs-preview.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: docs-preview
          path: .docs-preview.md

  # ── 契机二：主干合并后的正式更新 ─────────────────────────────
  update:
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要历史来做 diff，50 条足够覆盖常规提交
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 更新当前态文档
        # 模型接口怎么配见文件头；这里只给密钥，地址和模型名从 .knowledge.mjs 读
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          # LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node scripts/docs-update.mjs --mode incremental

      - name: 开文档 PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: 自动更新模块文档"
          title: "docs: 自动更新模块文档"
          body: |
            由主干合并事件自动触发，基于最新代码重新生成。

            请重点确认：
            - [ ] 有没有描述代码中不存在的功能（最需要警惕的一类错误）
            - [ ] 有没有复述源码而不是描述职责
            - [ ] 标了 `[待确认]` 的地方是否需要补充

            如果内容长期有问题，请改 `scripts/prompts/module.md`，不要手动改 `docs/current/`
            —— 下次生成会覆盖掉。

            未变的模块不会被重新生成，所以本次改动范围应该很小。
          branch: docs/auto-update
          delete-branch: true
          labels: documentation, automated
          add-paths: |
            docs/**

  # ── 契机三：Release 标签 → 版本章节 ──────────────────────────
  chapter:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成版本演进章节
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          # LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          node scripts/docs-update.mjs \
            --mode chapter \
            --version=${{ github.event.release.tag_name }}

      - name: 开章节 PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: 新增 ${{ github.event.release.tag_name }} 版本章节"
          title: "docs: 新增 ${{ github.event.release.tag_name }} 版本章节"
          body: |
            从上一个 tag 到本次发布之间的变更，被压缩成一段演进叙事。

            请重点确认：
            - [ ] 有没有替作者编造改动原因（提示词已禁止，但仍需抽查）
            - [ ] 主要变更是否控制在 5 条以内，有没有变成提交列表
            - [ ] 「与上一版的关系」是否准确
          branch: docs/release-${{ github.event.release.tag_name }}
          delete-branch: true
          labels: documentation, automated

  # ── 契机四：每日巡检 ─────────────────────────────────────────
  # 兜底机制：找出「代码变了但文档没跟上」的漏网模块。
  # 触发失败、流水线被跳过、有人绕过了流程，都会在这里被兜住。
  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 巡检并修复漂移
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          # LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: node scripts/docs-update.mjs --mode audit --fix

      - name: 有漂移时开 PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: 巡检修复漂移文档"
          title: "docs: 巡检修复漂移文档"
          body: |
            每日定时巡检发现，以下情况会被修复：

            - 代码已变更但文档未更新（触发遗漏）
            - 从未生成过文档的模块
            - 配置中路径失效的模块（巡检会同时报告配置健康度）

            如果没有漂移，本次不会产生任何 PR。
          branch: docs/audit-fix
          delete-branch: true
          labels: documentation, automated
